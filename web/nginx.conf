server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static UI
    location / {
        try_files $uri $uri/ =404;
    }

    # API: nginx strips nothing — /api/tasks is proxied as-is to the api
    # service (docker-compose service name / any host named "api").
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics, exposed through the same origin for convenience.
    location = /metrics {
        proxy_pass http://api:3000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Liveness of the proxy itself.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
