---
# TaskBoard host configuration.
#
# Provisions a fresh Ubuntu 22.04+ host with Docker (official apt repo),
# firewall rules, the repo checkout and the running compose stack.
# Terraform's user_data does a minimal bootstrap; this playbook is the
# repeatable, idempotent way to configure (or re-configure) the host.
#
#   ansible-playbook -i inventory playbook.yml
- name: Configure the TaskBoard host
  hosts: taskboard
  become: true

  vars:
    app_user: ubuntu
    repo_url: https://github.com/Samir-Khadka/taskboard-devops.git
    repo_version: main
    app_dir: "/home/{{ app_user }}/taskboard-devops"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - ufw
        state: present

    - name: Create the apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the app user to the docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Allow traffic through the firewall
      ansible.builtin.command: "ufw allow {{ item }}"
      loop:
        - "22/tcp"
        - "80/tcp"
        - "443/tcp"
        - "8080/tcp"
      register: _ufw_allow
      changed_when: "'Rules updated' in _ufw_allow.stdout or 'Rule added' in _ufw_allow.stdout"

    - name: Enable the firewall
      ansible.builtin.command: ufw --force enable
      register: _ufw_enable
      changed_when: "'Firewall is active' in _ufw_enable.stdout"

    - name: Clone or update the repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        update: true
      become: false

    - name: Ensure a .env exists (from the example) on first run
      ansible.builtin.copy:
        src: "{{ app_dir }}/.env.example"
        dest: "{{ app_dir }}/.env"
        remote_src: true
        force: false
        mode: "0600"
      become: false

    - name: Build and start the compose stack
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become: false
      register: _compose_up
      changed_when: "'Started' in _compose_up.stderr or 'Created' in _compose_up.stderr or 'Recreated' in _compose_up.stderr"

    - name: Wait for the web UI to answer
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        status_code: 200
      register: _health
      retries: 12
      delay: 5
      until: _health.status == 200
