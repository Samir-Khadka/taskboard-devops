apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.apiName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.config.port }}
      targetPort: http
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.webName" . }}
  labels:
    {{- include "taskboard.webLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskboard.webSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
