{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "taskboard.apiName" . }}
                port:
                  number: {{ .Values.api.config.port }}
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "taskboard.apiName" . }}
                port:
                  number: {{ .Values.api.config.port }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "taskboard.webName" . }}
                port:
                  number: 80
          {{- end }}
{{- end }}
