name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test:
    name: App — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: taskboard-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: taskboard-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  k8s-helm:
    name: Kubernetes & Helm — validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/taskboard

      - name: Helm template renders
        run: helm template taskboard helm/taskboard > /dev/null

      - name: Validate raw manifests with kubeconform
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" ghcr.io/yannh/kubeconform:latest \
            -strict -summary \
            /work/k8s/namespace.yaml \
            /work/k8s/configmap.yaml \
            /work/k8s/deployment.yaml \
            /work/k8s/service.yaml \
            /work/k8s/web-deployment.yaml \
            /work/k8s/web-service.yaml \
            /work/k8s/ingress.yaml \
            /work/k8s/hpa.yaml
