name: ShipIt publish

# Builds the ShipIt images and publishes them to GHCR on every push to
# main that touches the app or web code. Tags are :<sha> only — no
# :latest — so the ShipIt GitOps loop always pins an exact image.
#
# How the loop closes:
#   1. build: image -> GHCR :<sha> (Trivy gate first, HIGH/CRITICAL fixed).
#   2. bump-shipit (needs a repo secret SHIPIT_BUMP_PAT with write access
#      to Samir-Khadka/shipit-platform): writes the new :<sha> tags into
#      k8s/services/taskboard/*.yaml there; ArgoCD syncs them to the cluster.
#   Without that PAT the workflow still publishes images; Samir then runs
#   scripts/bump-service-image.sh manually from the shipit-platform repo.
#
# ci.yml (tests) and cd.yml (manual Render deploy) are untouched by this
# workflow; do not wire this into either of them.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "Dockerfile*"
      - ".github/workflows/shipit-publish.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build, scan & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dir: app
            image: taskboard-devops-api
          - dir: web
            image: taskboard-devops-web
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (scan before push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          load: true
          push: false
          tags: ghcr.io/samir-khadka/${{ matrix.image }}:${{ github.sha }}
      - name: Scan image with Trivy
        # Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix
        # available. ignore-unfixed keeps the gate actionable — it blocks
        # on what we can fix, not on unfixable base-image noise.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/samir-khadka/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image to GHCR
        run: docker push ghcr.io/samir-khadka/${{ matrix.image }}:${{ github.sha }}

  bump-shipit:
    # Closes the GitOps loop: write the new :<sha> tags into the
    # shipit-platform repo so ArgoCD deploys them to the cluster.
    #
    # NOTE: the `secrets` context is NOT allowed in a job-level `if`
    # (GitHub rejects the whole run with "Unrecognized named-value:
    # 'secrets'"). The PAT check therefore happens in a step below; the
    # job is gated only on event/ref, which the `github` context allows.
    # Without the PAT the job prints the manual fallback and succeeds.
    name: Bump ShipIt image tags
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for SHIPIT_BUMP_PAT
        id: has-pat
        env:
          PAT: ${{ secrets.SHIPIT_BUMP_PAT }}
        run: |
          if [ -n "${PAT}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SHIPIT_BUMP_PAT is not set on this repo — skipping the automatic tag bump."
            echo "Run scripts/bump-service-image.sh from the shipit-platform repo manually instead."
          fi
      - uses: actions/checkout@v4
        if: steps.has-pat.outputs.present == 'true'
        with:
          repository: Samir-Khadka/shipit-platform
          token: ${{ secrets.SHIPIT_BUMP_PAT }}
          fetch-depth: 0
          path: shipit-platform
      - name: Bump taskboard image tags to the new sha
        if: steps.has-pat.outputs.present == 'true'
        working-directory: shipit-platform
        run: |
          set -e
          SHA="${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2; do
            git fetch origin main
            git reset --hard origin/main
            for svc in api web; do
              sed -i -E "s#(image: ghcr.io/samir-khadka/taskboard-devops-${svc}:)[^[:space:]]+#\1${SHA}#" k8s/services/taskboard/${svc}.yaml
            done
            git add k8s/services/taskboard/
            if git diff --cached --quiet; then
              echo "image tags already at ${SHA}; nothing to do"
              exit 0
            fi
            git commit -m "[service-bump] taskboard -> ${SHA}"
            if git push origin main; then
              echo "tag bump pushed"
              exit 0
            fi
            echo "push raced (attempt ${attempt}/2), retrying..."
            sleep 10
          done
          echo "failed to push tag bump after 2 attempts" >&2
          exit 1
