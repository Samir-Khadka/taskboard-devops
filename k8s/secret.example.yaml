# EXAMPLE ONLY — do not commit a real secret, and note this file is
# deliberately NOT listed in kustomization.yaml.
#
# Create the real secret imperatively instead, e.g.:
#
#   kubectl -n taskboard create secret generic taskboard-api-secret \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/taskboard'
#
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-api-secret
  namespace: taskboard
type: Opaque
stringData:
  DATABASE_URL: "postgres://taskboard:change-me@postgres.example.internal:5432/taskboard"
